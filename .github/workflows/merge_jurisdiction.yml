name: "[auto] Merge - Jurisdiction"
# civicpatch.org opens a PR from its fork for each jurisdiction edit and labels it. The label and
# the validation can finish in either order, so both start this job.
on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: ["[auto] Validate - OCD-IDs"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: "merge-jurisdiction-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}"
  cancel-in-progress: false

jobs:
  merge-jurisdiction-pr:
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # The default branch, never the PR's: this job holds a write token.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Merge if the gate passes
        run: uv run python scripts/github_actions/merge_jurisdiction_pr.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
