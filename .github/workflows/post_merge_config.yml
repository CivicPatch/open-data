name: "[auto] Post Merge - Sync Config"
# Merges by the labelled-PR workflow sync there: a merge made with GITHUB_TOKEN starts no push run.
on:
  push:
    branches: [main]
    paths:
      - "data_source/config.yml"
      - "data_source/*/config.yml"
      - "data_source/*/*/config.yml"
env:
  PYTHONPATH: ${{ github.workspace }}

permissions:
  contents: read

concurrency:
  group: "post-merge-config"
  cancel-in-progress: false

jobs:
  sync-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Sync changed config files to civicpatch.org
        run: uv run python scripts/github_actions/sync_config_push.py
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          CIVICPATCH_ORG_URL: ${{ vars.CIVICPATCH_ORG_URL }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
