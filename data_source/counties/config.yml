# The roles of a county, and the government forms it may have with the organizations each one has.
# Most states name their county organizations differently, so a state's
# data_source/<state>/counties/config.yml lists the form its counties use with its own names.
roles:
- id: mayor
  label: Mayor
  is_unique: true
  selection_method: elected_by_voters
  aliases: []
- id: county-executive
  label: County Executive
  is_unique: true
  selection_method: elected_by_voters
  aliases: []
- id: county-judge
  label: County Judge
  is_unique: true
  selection_method: elected_by_voters
  aliases: []
- id: member
