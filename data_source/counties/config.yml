# Government forms a county may have, and the organizations each one has. Most states name
# their county organizations differently, so a state's data_source/<state>/counties/config.yml
# lists the form its counties use with its own names.
government_forms:
  commission:
    organizations:
      - {name: Board of Commissioners, role_labels: [Commissioner, Chair]}
  council_manager:
    organizations:
      - {name: County Council, role_labels: [Council Member, Chair]}
  county_executive:
    organizations:
      - {name: County Council, role_labels: [Council Member, Chair]}
      - {name: County Executive, role_labels: [County Executive]}
