# Vermont writes "Selectboard" as one word (17 V.S.A. § 2646, 24 V.S.A. § 871). Towns hold town
# meeting; Brattleboro's is representative. Cities are mayor-council or council-manager by charter.
# Villages elect "a presiding officer, a clerk, five trustees, a treasurer, and a collector of
# taxes" (24 V.S.A. §§ 1304, 1305), unless a charter says otherwise.
# The town officers of 17 V.S.A. § 2646, and the boards it and Titles 18, 22 and 24 set up. An
# office with one holder is a Town Officers post; one the law gives joint authority (three or
# more, 1 V.S.A. § 172) is its own organization. Here rather than the country file until another
# state shares them.
roles:
- id: lister
  label: Lister
  aliases:
  - Town Lister
  - Listers
  - Board of Listers
- id: auditor
  label: Auditor
  aliases:
  - Town Auditor
  - Auditors
  - Town Auditors
- id: first-constable
  label: First Constable
  is_unique: true
  aliases:
  - Constable
  - Town Constable
- id: second-constable
  label: Second Constable
  is_unique: true
- id: delinquent-tax-collector
  label: Collector of Delinquent Taxes
  is_unique: true
  aliases:
  - Delinquent Tax Collector
- id: tax-collector
  label: Collector of Taxes
  is_unique: true
  aliases:
  - Tax Collector
  - Village Tax Collector
- id: trustee-of-public-funds
  label: Trustee of Public Funds
  aliases:
  - Trustees of Public Funds
- id: trustee-of-public-money
  label: Trustee of Public Money
  is_unique: true
- id: cemetery-commissioner
  label: Cemetery Commissioner
  aliases:
  - Cemetery Commissioners
  - Board of Cemetery Commissioners
- id: patrol-officer
  label: Patrol Officer
  aliases:
  - Patrol Officers
- id: road-commissioner
  label: Road Commissioner
  aliases:
  - Road Commissioners
- id: water-commissioner
  label: Water Commissioner
  aliases:
  - Water Commissioners
- id: budget-committee-member
  label: Advisory Budget Committee Member
  aliases:
  - Advisory Budget Committee
  - Budget Committee Member
- id: library-trustee
  label: Library Trustee
  aliases:
  - Library Trustees
  - Board of Library Trustees
government_forms:
  mayor_council:
    suffixes: [city]
  council_manager:
    suffixes: [city]
  village_board:
    suffixes: [village]
    organizations:
      - {name: Board of Trustees, role_labels: [Trustee, Village President]}
      - {name: Village Officers, role_labels: [Village Clerk, Village Treasurer, Collector of Taxes]}
  open_town_meeting:
    suffixes: [town]
    organizations:
      - {name: Selectboard, role_labels: [Select Board Member, Chair, Vice Chair]}
      - {name: Town Meeting, role_labels: [Moderator]}
      - {name: Town Officers, role_labels: [Town Clerk, Town Treasurer, First Constable, Second Constable, Collector of Delinquent Taxes, Trustee of Public Money, Road Commissioner, Patrol Officer, Town Manager]}
      - {name: Board of Listers, role_labels: [Lister]}
      - {name: Town Auditors, role_labels: [Auditor]}
      - {name: Trustees of Public Funds, role_labels: [Trustee of Public Funds]}
      - {name: Board of Cemetery Commissioners, role_labels: [Cemetery Commissioner]}
      - {name: Water Commissioners, role_labels: [Water Commissioner]}
      - {name: Advisory Budget Committee, role_labels: [Advisory Budget Committee Member]}
      - {name: Board of Library Trustees, role_labels: [Library Trustee]}
  representative_town_meeting:
    suffixes: [town]
    organizations:
      - {name: Selectboard, role_labels: [Select Board Member, Chair, Vice Chair]}
      - {name: Town Meeting, role_labels: [Moderator, Town Meeting Member]}
      - {name: Town Officers, role_labels: [Town Clerk, Town Treasurer, First Constable, Second Constable, Collector of Delinquent Taxes, Trustee of Public Money, Road Commissioner, Patrol Officer, Town Manager]}
      - {name: Board of Listers, role_labels: [Lister]}
      - {name: Town Auditors, role_labels: [Auditor]}
      - {name: Trustees of Public Funds, role_labels: [Trustee of Public Funds]}
      - {name: Board of Cemetery Commissioners, role_labels: [Cemetery Commissioner]}
      - {name: Water Commissioners, role_labels: [Water Commissioner]}
      - {name: Advisory Budget Committee, role_labels: [Advisory Budget Committee Member]}
      - {name: Board of Library Trustees, role_labels: [Library Trustee]}
# Title 24 Appendix publishes every charter; a place without one runs on general law.
governing_law:
  charter_terms: [Charter]
  charter_link_list:
    url: https://legislature.vermont.gov/statutes/title/24APPENDIX
    # A charter's whole link text: "Chapter 153 : Town of Stowe" for Stowe town.
    title: "Chapter {*} : {lsad} of {place}"
    # The index links a chapter's contents; its text is the full-chapter page.
    text_link: {old: /statutes/chapter/, new: /statutes/fullchapter/}
  classifications:
    town:
      lsad: [town]
      governed_by: charter_or_general_law
      general_law:
        - https://legislature.vermont.gov/statutes/section/17/055/02646
        - https://legislature.vermont.gov/statutes/section/17/055/02649
        - https://legislature.vermont.gov/statutes/section/17/055/02650
        - https://legislature.vermont.gov/statutes/section/17/055/02651
        - https://legislature.vermont.gov/statutes/section/17/055/02651a
        - https://legislature.vermont.gov/statutes/section/17/055/02651b
        - https://legislature.vermont.gov/statutes/section/17/055/02651c
        - https://legislature.vermont.gov/statutes/section/17/055/02651d
        - https://legislature.vermont.gov/statutes/section/17/055/02651e
        - https://legislature.vermont.gov/statutes/section/17/055/02651f
        - https://legislature.vermont.gov/statutes/section/17/055/02652
        - https://legislature.vermont.gov/statutes/section/24/033/00871
        - https://legislature.vermont.gov/statutes/section/24/037/01232
        - https://legislature.vermont.gov/statutes/section/24/037/01236
        - https://legislature.vermont.gov/statutes/section/24/037/01240
        - https://legislature.vermont.gov/statutes/section/24/065/02431
        - https://legislature.vermont.gov/statutes/section/18/121/05373
        - https://legislature.vermont.gov/statutes/section/18/121/05374
        - https://legislature.vermont.gov/statutes/section/22/003/00143
    # No general statute organizes a city's government; each has a charter.
    city:
      lsad: [city]
      governed_by: charter
    village:
      lsad: [village]
      governed_by: charter_or_general_law
      general_law:
        - https://legislature.vermont.gov/statutes/section/24/039/01304
        - https://legislature.vermont.gov/statutes/section/24/039/01305
        - https://legislature.vermont.gov/statutes/section/24/039/01308
