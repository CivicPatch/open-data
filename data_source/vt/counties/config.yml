# Vermont's counties have no governing board: no commission, council or executive, so none of
# the country's county government forms applies. They do elect officers (Vt. Const. ch. II
# §§ 43, 50, 51): two assistant judges, who keep the county's budget, tax and property and
# appoint its clerk and treasurer (24 V.S.A. §§ 131, 133, 171, 211), a sheriff, a state's
# attorney, a judge of probate and a high bailiff.
governing_law:
  charter_terms: []
  classifications:
    county:
      lsad: [county]
      governed_by: general_law
      general_law:
        # Ch. II §§ 43, 50, 51, 53: which county officers are elected, for how long.
        - https://legislature.vermont.gov/statutes/constitution-of-the-state-of-vermont/
        # 24 V.S.A. chapter 5, County Officers; Powers and Duties.
        - https://legislature.vermont.gov/statutes/fullchapter/24/005
