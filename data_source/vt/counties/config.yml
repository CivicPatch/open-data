# Vermont's counties are governed by two assistant judges (Vt. Const. ch. II §§ 43, 50, 51), who
# keep the county's budget, tax and property and appoint its clerk and treasurer (24 V.S.A.
# §§ 131, 133, 171, 211): a commission in all but name. The other elected county officers (a
# sheriff, a state's attorney, a judge of probate, a high bailiff) are not collected.
government_forms:
  commission:
    suffixes: [county]
    organizations:
      - {name: Assistant Judges, role_labels: [Assistant Judge]}
governing_law:
  charter_terms: []
  classifications:
    county:
      lsad: [county]
      governed_by: general_law
      general_law:
        # Ch. II §§ 43, 50, 51, 53: which county officers are elected, for how long.
        - https://legislature.vermont.gov/statutes/constitution-of-the-state-of-vermont/
        # 24 V.S.A. chapter 5, County Officers; Powers and Duties.
        - https://legislature.vermont.gov/statutes/fullchapter/24/005
