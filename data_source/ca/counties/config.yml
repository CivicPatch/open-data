# Every California county is governed by an elected board of supervisors (Cal. Const. Art. XI § 1(b)): five
# members (Gov. Code § 25000), or five or more by charter (Art. XI § 4(a)), through which the county exercises its
# powers (§ 23005). The board elects its chair (§ 25020).
# Not collected, since only the board is required: the administrative officer it may provide for (§ 24000(t)),
# the district attorney, sheriff, assessor and the other elected officers (§ 24009(a)), and the superintendent of
# schools. The aliases keep the officer's titles (administrator, administrative officer, executive officer, chief
# executive officer) parsing to one role.
role_aliases:
  county-manager: [County Administrative Officer, County Executive Officer, Chief Administrative Officer, Chief Executive Officer]
government_forms:
  council_manager:
    suffixes: [county]
    organizations:
      - {name: Board of Supervisors, role_labels: [Supervisor, Chair]}
governing_law:
  charter_terms: [Charter]
  classifications:
    # Art. XI § 4(g): a charter displaces the general law only "for which provision is made therein".
    county:
      lsad: [county]
      governed_by: charter_or_general_law
      general_law:
        # §§ 23000-23005: a county's powers, exercised through its board.
        - https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=GOV&division=1.&title=3.&part=&chapter=1.&article=
        # §§ 24000-24011: the county officers, and which are elected.
        - https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=GOV&division=2.&title=3.&part=1.&chapter=1.&article=
        # §§ 25000-25021: the board of supervisors and its chair.
        - https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=GOV&division=2.&title=3.&part=2.&chapter=1.&article=
