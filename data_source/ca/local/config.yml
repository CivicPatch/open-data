# Every California city is general law or chartered (Gov. Code §§ 34101, 34102); "town" is a name a general-law
# city may take (§ 34502). A general-law city is governed by an elected council of at least five (§§ 36501(a),
# 36503); its mayor sits on the council, chosen by the council with a mayor pro tempore (§ 36801) or elected
# (§§ 34900-34903); an ordinance may create a city manager (§§ 34851-34856). A charter city's offices are its
# charter's (Cal. Const. Art. XI § 5(b)), mostly the same council and manager. Mayor-council is saved per city
# whose charter makes the mayor its chief executive (San Diego Charter § 265(b)(1)).
# Not collected: the city clerk, treasurer, attorney, and police and fire chiefs (§§ 36501(b)-(e), 36505), and a
# charter city's elected attorney, auditor or controller, who carry out tasks.
government_forms:
  council_manager:
    suffixes: [city, town]
    organizations:
      - {name: "{lsad} Council", role_labels: [Council Member, Mayor, Mayor Pro Tempore]}
      - {name: "{lsad} Officers", role_labels: [City Manager]}
  mayor_council:
    organizations:
      - {name: "{lsad} Council", role_labels: [Council Member]}
      - {name: Office of the Mayor, role_labels: [Mayor]}
      - {name: "{lsad} Officers", role_labels: [City Manager]}
governing_law:
  charter_terms: [Charter]
  classifications:
    # Art. XI § 5: a charter city's offices are its charter's, and its silence does not bring in § 36501.
    city:
      lsad: [city, town]
      governed_by: charter_else_general_law
      general_law:
        # §§ 36501-36525: a general-law city's officers and their election.
        - https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=GOV&division=3.&title=4.&part=1.&chapter=&article=
        # §§ 36801-36815: the council's organization, its mayor and mayor pro tempore.
        - https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=GOV&division=3.&title=4.&part=2.&chapter=1.&article=
        # §§ 40601-40605: the mayor's duties.
        - https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=GOV&division=3.&title=4.&part=3.&chapter=1.&article=
        # §§ 34851-34906: the city manager, council districts and the elective mayor.
        - https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?lawCode=GOV&division=2.&title=4.&part=1.&chapter=4.&article=
