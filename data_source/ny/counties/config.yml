# New York's 57 counties outside New York City each have one legislative body, a board of supervisors of the
# towns' and cities' supervisors (CNT § 150) or an elected legislature "by whatsoever name designated"
# (CNT § 150-a): named County Legislature here for all. The County Law gives no executive (DOS Local Government
# Handbook, 2018, p. 51). A charter county may elect a county executive (MHRL § 33(4)(b)): 18 do. Others appoint a
# county manager (10) or administrator (23) by charter or local law, and 6 run through the board's chair and
# committees (NYSAC, County Government Organization, 2026, pp. 6, 9-10). Council-manager is the default; a county
# with an executive or run by its board has its form saved.
# New York City's five counties have no county government (CNT § 2(a); MHRL § 32(3)).
# Not collected: the sheriff, county clerk, coroners and treasurer, who carry out tasks (CNT § 400; Handbook
# p. 55); the district attorney, a state office; the county judge, surrogate and family court judge, courts.
role_aliases:
  member: [Legislator, County Legislator]
government_forms:
  council_manager:
    suffixes: [county]
    organizations:
      - {name: County Legislature, role_labels: [Legislator, Supervisor, Chair, Vice Chair]}
      - {name: County Officers, role_labels: [County Manager]}
  county_executive:
    organizations:
      - {name: County Legislature, role_labels: [Legislator, Supervisor, Chair, Vice Chair]}
      - {name: County Executive, role_labels: [County Executive]}
  commission:
    organizations:
      - {name: County Legislature, role_labels: [Legislator, Supervisor, Chair, Vice Chair]}
governing_law:
  charter_terms: [Charter]
  classifications:
    # CNT § 2(b): only County Law provisions in conflict with a charter are displaced.
    county:
      lsad: [county]
      governed_by: charter_or_general_law
      general_law:
        - https://www.nysenate.gov/legislation/laws/CNT/150
        - https://www.nysenate.gov/legislation/laws/CNT/150-A
