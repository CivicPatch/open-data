# Government forms a city, town, village or township may have, and the organizations each one
# has. A state's data_source/<state>/local/config.yml narrows or renames these. Role labels must
# name a role (or alias) in data_source/config.yml.
government_forms:
  mayor_council:
    organizations:
      - {name: Council, role_labels: [Council Member]}
      - {name: Office of the Mayor, role_labels: [Mayor]}
  council_manager:
    organizations:
      - {name: Council, role_labels: [Council Member, Mayor]}
  commission:
    organizations:
      - {name: Commission, role_labels: [Commissioner, Mayor]}
  township_board:
    organizations:
      - {name: Board, role_labels: [Supervisor, Clerk, Treasurer, Trustee]}
  open_town_meeting:
    organizations:
      - {name: Select Board, role_labels: [Select Board Member, Chair, Vice Chair]}
      - {name: Town Meeting, role_labels: [Moderator]}
  representative_town_meeting:
    organizations:
      - {name: Select Board, role_labels: [Select Board Member, Chair, Vice Chair]}
      - {name: Town Meeting, role_labels: [Moderator, Town Meeting Member]}
