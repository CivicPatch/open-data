government_forms:
  # Council form with no executive: Abbeville, Allendale, Calhoun, Laurens.
  commission:
    organizations:
      - {name: County Council, role_labels: [Council Member, Chair, Vice Chair]}
  council_manager:
    organizations:
      - {name: County Council, role_labels: [Council Member, Chair, Vice Chair]}
  # Elected supervisor who chairs council: Berkeley, Union, Williamsburg.
  county_executive:
    organizations:
      - {name: County Council, role_labels: [Council Member, Vice Chair]}
      - {name: County Supervisor, role_labels: [Supervisor]}
