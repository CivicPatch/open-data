#   issues             - Per-county problems: no_wiki_match, geoid_mismatch, no_official_url.
#                        Replaced on every run.
#   generated_comments - Script-generated notes (e.g. wiki URL candidates). Replaced each run.
#   comments           - Free-form human notes; NEVER overwritten by scripts.
#   warnings           - Root-level: warnings not tied to a specific county.

