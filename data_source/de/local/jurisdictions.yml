# AUTO-GENERATED by scripts/jurisdictions/local.py — safe to re-run, comments and manual edits are preserved.

# Fields per jurisdiction:
#   id                 - OCD-ID for the jurisdiction; stable once assigned — preserved across runs
#                        via GEOID matching even if the Census name changes.
#   name               - Common name including LSAD suffix (e.g. 'Newark city'); updated each run.
#   url                - Official government website (from the Wikipedia infobox); only written if
#                        absent — existing values are never overwritten by scripts.
#   wiki_url           - Wikipedia page URL for this jurisdiction.
#   population         - ACS 5-year population estimate; updated on every run.
#   geoid              - Census FIPS GEOID; stable identifier used to match jurisdictions across
#                        runs — never changes for an incorporated place.
#   status             - Lifecycle: absent = active, 'inactive' = dropped from census.
#   parent_ocdids      - Containing jurisdictions, from a boundary overlay against the county map:
#                        every county the place materially overlaps (largest share first — a place
#                        may straddle a county line), then the state. Replaced on every run.
#   issues             - Per-jurisdiction problems: ocdid_collision, no_wiki_match,
#                        geoid_mismatch. Replaced on every run.
#   generated_comments - Script-generated notes (e.g. wiki URL candidates). Replaced each run.
#   comments           - Free-form human notes; NEVER overwritten by scripts.
#   warnings           - Root-level: warnings not tied to a specific jurisdiction.

