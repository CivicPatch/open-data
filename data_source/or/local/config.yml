# Every Oregon city and town has a charter; ORS 221 binds only those organized under its acts, so a
# stored charter is read alone and the statute is the fallback. Roles and forms come from the level.
governing_law:
  charter_terms: [Charter]
  classifications:
    city:
      lsad: [city, town]
      governed_by: charter_else_general_law
      general_law:
        # ORS 221: organization and government of cities.
        - https://www.oregonlegislature.gov/bills_laws/ors/ors221.html
