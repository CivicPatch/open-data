# Every Oregon city and town has a charter, and ORS 221 binds only those organized under its acts, so
# a charter is read alone and none found is a miss to resolve, not a statute to fall back on.
# Roles come from the level.
# Legislative and executive offices only: an elected recorder, judge or auditor is not collected.
government_forms:
  mayor_council:
    organizations:
      - {name: "{lsad} Council", role_labels: [Councilor]}
      - {name: Office of the Mayor, role_labels: [Mayor]}
      - {name: "{lsad} Officers", role_labels: [City Manager]}
  council_manager:
    suffixes: [city, town]
    organizations:
      - {name: "{lsad} Council", role_labels: [Councilor, Mayor]}
      - {name: "{lsad} Officers", role_labels: [City Manager]}
governing_law:
  charter_terms: [Charter]
  classifications:
    city:
      lsad: [city, town]
      governed_by: charter
