# Fields per county:
#   id                 - OCD-ID:
#                        ocd-jurisdiction/country:us/state:{state}/county:{name}/government;
#                        stable once assigned — preserved via GEOID matching if Census name
#                        changes.
#   name               - Common name including type suffix (e.g. 'King County'); updated each run.
#   url                - Official government website (from the Wikipedia infobox); only written if
#                        absent — existing values are never overwritten by scripts.
#   extras             - Non-standard fields, as in the OCD jurisdiction schema.
#                        extras.government_form: form of government (e.g. mayor_council);
#                        overrides the config files, needed only where they allow more than one
#                        form. Never written by scripts.
#   wiki_url           - Wikipedia page URL for this county.
#   population         - ACS 5-year population estimate; updated on every run.
#   geoid              - Census FIPS GEOID (state + county, 5 digits); stable identifier.
#   status             - Lifecycle: absent = active, 'inactive' = dropped from census. NOTE: not
#                        yet written by scripts/jurisdictions/counties.py.
#   issues             - Per-county problems: no_wiki_match, geoid_mismatch, no_official_url.
#                        Replaced on every run.
#   generated_comments - Script-generated notes (e.g. wiki URL candidates). Replaced each run.
#   comments           - Free-form human notes; NEVER overwritten by scripts.
#   warnings           - Root-level: warnings not tied to a specific county.

